<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Edy — Standalone demo</title>
    <link rel="icon" type="image/png" href="../../src/assets/edy-logo.png">
    <style>
      html, body { width: 100%; height: 100%; margin: 0; }
      #edy-container { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="edy-container"></div>
    <script type="module">
      import { createEdy } from '../../src/index.js';
      import { demoExtension } from '../../src/extensions/demo.js';
      import { createDemoAssets } from '../../examples/assets-demo.js';

      const locale = new URLSearchParams(location.search).get('locale') === 'es' ? 'es' : 'en';
      const editor = createEdy({
        container: document.querySelector('#edy-container'),
        locale,
        theme: 'system',
        services: { assets: createDemoAssets(locale) },
        extensions: [demoExtension],
      });
      await editor.start();
      window.addEventListener('pagehide', () => editor.dispose(), { once: true });
    </script>
  </body>
</html>
